name: pmcp-cpp CI

# Build, unit tests, and interop for the C++ SDK.
#
# Interop caveat, stated plainly: the cross-implementation checks in
# tests/interop exercise the real pmcp-python SDKs, which live in a sibling
# repository. This workflow only has pmcp-cpp, so the interop ctest skips
# here (the script exits 77 = ctest SKIP when the siblings or their
# dependencies are absent). That is not a pass: it proves nothing about
# cross-implementation behaviour, which is why it is re-run locally on the
# release machine (see LIMITATIONS.md). The unit suite and the build are the
# CI gate; they fail the job for real.
#
# Releases are created by the org's publish-repos.sh (Step 8), which appends
# the LIMITATIONS.md link and gates on CI. No release job lives here, so tags
# cannot double-fire a GitHub release that conflicts with that script.

on:
  push:
    branches: [main, develop]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-and-test:
    name: Build and test (C++20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DPMCP_WITH_ROS2=OFF

      - name: Build
        run: cmake --build build -j2

      - name: Run tests (unit suite; interop skips without sibling SDKs)
        run: ctest --test-dir build --output-on-failure

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore